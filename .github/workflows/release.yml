name: Release

# Push a tag matching the version in manifest.json (e.g. 1.1.0, no "v")
# to build the plugin and create a draft GitHub release with the files
# Obsidian needs.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  # for the build provenance attestations
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
      - run: npm test
      # the build also runs the type check
      - run: npm run build
      # signed records that these files were built here, from this repository's code
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --draft --title "$GITHUB_REF_NAME" --generate-notes
